[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc-url-inspector"
dynamic = ["version"]
description = "Bulk Google Search Console URL Inspection API client and CLI: service account or OAuth, quota-aware resumable runs, run-to-run diffs and CSV, JSON, Markdown and HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["google-search-console", "url-inspection", "technical-seo", "seo", "indexing", "canonical", "sitemap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/gsc-url-inspector"
Issues = "https://github.com/saizul/gsc-url-inspector/issues"
Changelog = "https://github.com/saizul/gsc-url-inspector/blob/main/CHANGELOG.md"

[project.scripts]
gsc-url-inspector = "gsc_url_inspector.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gsc_url_inspector._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gsc_url_inspector = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
